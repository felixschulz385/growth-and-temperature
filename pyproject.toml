[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "src"
version = "0.1.0"
description = "Growth and Temperature (GNT) satellite data processing pipeline"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
