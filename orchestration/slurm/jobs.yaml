  # ntl_harm declares PREPARE (STEPS = FETCH, PREPARE, GRID) but only ever
  # had a GRID job. Resources below are NOT transcribed from a prior
  # committed script (none ever existed for this step); modeled on the
  # repo-wide PREPARE-uses-roughly-half-of-GRID's-cpu/mem pattern
  # (acag/esacci's own prepare-vs-grid split) rather than guessed outright,
  # but should still be re-tuned against a real run.
  - name: ntl_harm-prepare
    log_key: ntl_harm
    source: ntl_harm
    step: prepare
    time: "06:00:00"
    qos: 6hours
    cpus: 4
    mem: 128G
    mem_fraction: 0.6
    temp_dir_prefix: ntl_harm

  - name: ntl_harm-grid
