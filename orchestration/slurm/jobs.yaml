  # equally-registered eog_dmsp/eog_viirs/eog_dvnl ids) never had PREPARE/GRID
  # jobs -- only eog_viirs did, since its first commit. Resources below are
  # NOT transcribed from a prior committed script (none ever existed for
  # these two); they're a starting point copied from the closest sibling
  # (eog_viirs) and should be re-tuned against real DMSP/DVNL run behavior,
  # unlike every other resource value in this file.
