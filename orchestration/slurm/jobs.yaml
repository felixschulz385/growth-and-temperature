# Parameter table for orchestration/slurm/generate_slurm_scripts.py.
#
# docs/design/09-integrated-pipeline.md §9: `stage`/`subsource` are retired
# in favour of `step` (fetch|prepare|grid, matching the new `data run`
# CLI) and per-source ids (the misc split gives osm/gadm/country_classifications
# their own entries instead of `source: misc, subsource: ...`). `host: egress`
# (default `slurm`) folds the previously-hand-maintained
# orchestration/scripts/modis-ingest-annual.sh into this generator -- MODIS's
# FETCH step needs outbound internet egress to Planetary Computer, which
# scicore's SLURM compute nodes may not have, so it runs wherever that access
# exists and pushes results via `transfer_after`.
#
# To add/change a job, edit here and regenerate:
#   python orchestration/slurm/generate_slurm_scripts.py
# To check for drift (e.g. a generated .sh got hand-edited) without writing:
#   python orchestration/slurm/generate_slurm_scripts.py --check
#
# Resource fields (time/qos/partition/cpus/mem/mem_fraction) are transcribed
# from each script's prior committed value -- they encode real per-source
# tuning (e.g. glass_modis's 7-day prepare job, berman_mining's bigmem/30min
# job) and were preserved exactly, not guessed.
#
# FETCH steps are deliberately not covered here -- no download-family SLURM
# script has ever existed in this repo (fetch/download runs manually), and
# this refactor does not introduce one.
#
# Scripts NOT covered here (left as hand-maintained, standalone files):
# assemble_create.sh, assemble_update.sh, analysis.sh, compress.sh,
# rechunk-zarr.sh, validate-backbone-subset.sh, migrate-layout-v2.sh.
# demean_modis.sh is dead (docs/design/04-ingest.md §6's `assemble demean`
# finding) and removed in migration step 10's cutover, not generated here.

jobs:
  # acag's PREPARE now does the tiled reprojection work directly (the
  # PREPARE+GRID merge, docs/design successor to the ledger) -- there is no
  # separate GRID step or job anymore. Resources below keep the old GRID
  # job's larger cpu/mem/time envelope, since this one job now does that
  # work plus what PREPARE used to.
  - name: acag-prepare
    log_key: acag
    source: acag
    step: prepare
    time: "1-00:00:00"
    qos: 1day
    cpus: 8
    mem: 256G
    mem_fraction: 0.6
    temp_dir_prefix: acag

  # berman_mining disabled as a source (orchestration/configs/data.yaml) --
  # job left commented rather than deleted so it can be re-enabled together.
  # Step renamed grid -> prepare: berman_mining never had a separate PREPARE
  # step, so its one stage is now called PREPARE (Plan 2, docs/design
  # successor to the ledger -- PipelineStep.GRID no longer exists).
  # - name: berman_mining-prepare
  #   log_key: berman_mining
  #   source: berman_mining
  #   step: prepare
  #   partition: bigmem
  #   time: "00:30:00"
  #   qos: 30min
  #   cpus: 8
  #   mem: 256G
  #   mem_fraction: 0.6
  #   temp_dir_prefix: berman_mining

  # esacci's PREPARE now does the tiled reprojection work directly (the
  # PREPARE+GRID merge, docs/design successor to the ledger) -- there is no
  # separate GRID step or job anymore. Resources below keep the old GRID
  # job's larger cpu/mem envelope, since this one job now does that work
  # plus what PREPARE used to.
  - name: esacci-prepare
    log_key: esacci
    source: esacci
    step: prepare
    time: "1-00:00:00"
    qos: 1day
    cpus: 8
    mem: 256G
    mem_fraction: 0.6
    temp_dir_prefix: esacci

  # glass's PREPARE now builds each (year[, grid_cell])'s daily->annual
  # stats zarr AND reprojects it into the final output in one job (the
  # PREPARE+GRID merge, docs/design successor to the ledger) -- there is no
  # separate GRID step or job anymore. Time budgets below are the sum of the
  # old prepare+grid jobs' budgets (both phases now run sequentially in one
  # job); mem/cpus keep the larger of the two. Needs re-tuning against a
  # real run, same caveat as this file's other never-actually-profiled
  # glass/eog resource values.
  - name: glass-avhrr-prepare
    log_key: glass_avhrr
    source: glass_avhrr
    step: prepare
    time: "4-00:00:00"
    qos: 1week
    cpus: 8
    mem: 256G
    mem_fraction: 0.9
    temp_dir_prefix: glass_avhrr

  - name: glass-modis-prepare
    log_key: glass_modis
    source: glass_modis
    step: prepare
    partition: scicore
    time: "10-00:00:00"
    qos: 1week
    cpus: 8
    mem: 128G
    mem_fraction: 0.9
    temp_dir_prefix: glass_modis

  # gadm's PREPARE now extracts the vectors AND rasterizes them in one job
  # (the PREPARE+GRID merge, docs/design successor to the ledger) -- there
  # is no separate GRID step or job anymore. Resources below keep the old
  # GRID job's larger cpu/mem/time envelope.
  - name: gadm-prepare
    log_key: gadm
    source: gadm
    step: prepare
    partition: scicore
    time: "1-00:00:00"
    qos: 1day
    cpus: 8
    mem: 64G
    mem_fraction: 0.9
    temp_dir_prefix: gadm

  # ecoregions REQUIRES gadm's PREPARE (src/data/sources/ecoregions/source.py)
  # -- must be scheduled after gadm-prepare. PREPARE now simplifies the
  # vector, rasterizes it, AND builds the GID_3 dominant-biome table in one
  # job (the PREPARE+GRID merge, docs/design successor to the ledger) --
  # there is no separate GRID step or job anymore. Resources below keep the
  # old GRID job's larger cpu/mem envelope.
  - name: ecoregions-prepare
    log_key: ecoregions
    source: ecoregions
    step: prepare
    partition: scicore
    time: "1-00:00:00"
    qos: 1day
    cpus: 8
    mem: 64G
    mem_fraction: 0.9
    temp_dir_prefix: ecoregions

  # osm's PREPARE now simplifies the vector AND rasterizes it in one job
  # (the PREPARE+GRID merge, docs/design successor to the ledger) -- there
  # is no separate GRID step or job anymore. Resources below keep the old
  # GRID job's larger cpu/mem envelope.
  - name: osm-prepare
    log_key: osm
    source: osm
    step: prepare
    partition: scicore
    time: "00:30:00"
    qos: 30min
    cpus: 8
    mem: 64G
    mem_fraction: 0.9
    temp_dir_prefix: osm

  # country_classifications' PREPARE now joins HDI+World Bank AND maps onto
  # gadm's GID_0 ids in one job (the PREPARE+GRID merge, docs/design
  # successor to the ledger) -- there is no separate GRID step or job
  # anymore. Resources below keep the old GRID job's larger cpu/mem envelope.
  - name: country_classifications-prepare
    log_key: country_classifications
    source: country_classifications
    step: prepare
    partition: scicore
    time: "00:30:00"
    qos: 30min
    cpus: 4
    mem: 32G
    mem_fraction: 0.9
    temp_dir_prefix: country_classifications

  # commodity_prices declares FETCH + PREPARE only (no GRID -- a tiny
  # (commodity, year) lookup table). No -fetch job: per this file's own
  # convention (see header), FETCH is always run manually.
  - name: commodity_prices-prepare
    log_key: commodity_prices
    source: commodity_prices
    step: prepare
    partition: scicore
    time: "00:30:00"
    qos: 30min
    cpus: 2
    mem: 8G
    mem_fraction: 0.9
    temp_dir_prefix: commodity_prices

  # ntl_harm's PREPARE now does the tiled reprojection work directly (the
  # PREPARE+GRID merge, docs/design successor to the ledger) -- there is no
  # separate GRID step or job anymore. Resources below keep the old GRID
  # job's cpu/mem envelope (the heavier of the two former jobs), since this
  # one job now does that work plus what PREPARE used to.
  - name: ntl_harm-prepare
    log_key: ntl_harm
    source: ntl_harm
    step: prepare
    time: "06:00:00"
    qos: 6hours
    cpus: 8
    mem: 256G
    mem_fraction: 0.6
    temp_dir_prefix: ntl_harm

  # snl_mining's DuckDB feature build and tiled rasterization are now one
  # merged PREPARE job (Plan 2's PREPARE+GRID merge, docs/design successor
  # to the ledger) -- there is no separate GRID job anymore. Resources below
  # keep the old GRID job's larger cpu/mem/time envelope.
  - name: snl_mining-prepare
    log_key: snl_mining
    source: snl_mining
    step: prepare
    partition: scicore
    time: "1-00:00:00"
    qos: 1day
    cpus: 8
    mem: 128G
    mem_fraction: 0.6
    temp_dir_prefix: snl_mining
    extra_args: ["--override"]

  - name: modis-fetch
    log_key: modis
    source: modis
    step: fetch
    host: egress
    simple: true
    transfer_after: fetch

  - name: modis-prepare
    log_key: modis
    source: modis
    step: prepare
    time: "1-00:00:00"
    qos: 1day
    cpus: 8
    mem: 256G
    mem_fraction: 0.6
    temp_dir_prefix: modis

  # modis_robustness_11a1 (data.yaml's second MODIS config block, a bounded
  # tile/year subset -- see its own comment there) resolves to ModisSource
  # too but never had its own PREPARE job. FETCH is unaffected -- it's the
  # same egress/manual `data run --source modis_robustness_11a1 --step
  # fetch` path modis-fetch.sh documents, just not SLURM-generated (no
  # source-specific script needed there, unlike PREPARE). Resources copied
  # from modis-prepare as a conservative starting point (not transcribed
  # from a prior committed script); the robustness arm is a handful of
  # tiles/years, so this is likely over-provisioned and can be right-sized
  # down later.
  - name: modis-robustness-11a1-prepare
    log_key: modis_robustness_11a1
    source: modis_robustness_11a1
    step: prepare
    time: "1-00:00:00"
    qos: 1day
    cpus: 8
    mem: 256G
    mem_fraction: 0.6
    temp_dir_prefix: modis_robustness_11a1

  # eog's PREPARE now does the tiled reprojection work directly (the
  # PREPARE+GRID merge, docs/design successor to the ledger) -- there is no
  # separate GRID step or job anymore, so these three jobs absorb their old
  # eog-*-grid siblings' resource envelope (no longer "simple": PREPARE now
  # does that dask-based reprojection work itself). Renamed from
  # "eog-prepare" earlier -- that name was ambiguous (looked like it covered
  # all eog_* variants; it only ever ran eog_viirs).
  - name: eog-viirs-prepare
    log_key: eog_viirs
    source: eog_viirs
    step: prepare
    partition: scicore
    time: "06:00:00"
    qos: 6hours
    cpus: 8
    mem: 256G
    mem_fraction: 0.9
    temp_dir_prefix: eog_viirs

  # eog_dmsp/eog_dvnl disabled as sources (orchestration/configs/data.yaml)
