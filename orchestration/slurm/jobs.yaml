  # modis_robustness_11a1 (data.yaml's second MODIS config block, a bounded
  # tile/year subset -- see its own comment there) resolves to ModisSource
  # too but never had its own GRID job. FETCH is unaffected -- it's the same
  # egress/manual `pipeline run --source modis_robustness_11a1 --step fetch`
  # path modis-fetch.sh documents, just not SLURM-generated (no source-
  # specific script needed there, unlike GRID). Resources copied from
  # modis-grid as a conservative starting point (not transcribed from a
  # prior committed script); the robustness arm is a handful of tiles/years,
  # so this is likely over-provisioned and can be right-sized down later.
  - name: modis-robustness-11a1-grid
    log_key: modis_robustness_11a1
    source: modis_robustness_11a1
    step: grid
    time: "1-00:00:00"
    qos: 1day
    cpus: 8
    mem: 256G
    mem_fraction: 0.6
    temp_dir_prefix: modis_robustness_11a1

  # "simple" jobs: no dask-threads/memory-limit/temp-dir/dashboard-port,
  # matching their prior (lighter-weight) invocation exactly.
  # Renamed from "eog-prepare" -- that name was ambiguous (looked like it
  # covered all eog_* variants; it only ever ran eog_viirs), which is
  # exactly the confusion that surfaced the eog_dmsp/eog_dvnl gap below.
