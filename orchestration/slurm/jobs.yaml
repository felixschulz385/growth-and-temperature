# Parameter table for orchestration/slurm/generate_slurm_scripts.py.
#
# docs/design/09-integrated-pipeline.md §9: `stage`/`subsource` are retired
# in favour of `step` (fetch|prepare|grid, matching the new `pipeline run`
# CLI) and per-source ids (the misc split gives osm/gadm/country_classifications
# their own entries instead of `source: misc, subsource: ...`). `host: egress`
# (default `slurm`) folds the previously-hand-maintained
# orchestration/scripts/modis-ingest-annual.sh into this generator -- MODIS's
# FETCH step needs outbound internet egress to Planetary Computer, which
# scicore's SLURM compute nodes may not have, so it runs wherever that access
# exists and pushes results via `transfer_after`.
#
# To add/change a job, edit here and regenerate:
#   python orchestration/slurm/generate_slurm_scripts.py
# To check for drift (e.g. a generated .sh got hand-edited) without writing:
#   python orchestration/slurm/generate_slurm_scripts.py --check
#
# Resource fields (time/qos/partition/cpus/mem/mem_fraction) are transcribed
# from each script's prior committed value -- they encode real per-source
# tuning (e.g. glass_modis's 7-day prepare job, berman_mining's bigmem/30min
# job) and were preserved exactly, not guessed.
#
# FETCH steps are deliberately not covered here -- no download-family SLURM
# script has ever existed in this repo (fetch/download runs manually), and
# this refactor does not introduce one.
#
# Scripts NOT covered here (left as hand-maintained, standalone files):
# assemble_create.sh, assemble_update.sh, analysis.sh, compress.sh,
# rechunk-zarr.sh, validate-backbone-subset.sh, migrate-layout-v2.sh.
# demean_modis.sh is dead (docs/design/04-ingest.md §6's `assemble demean`
# finding) and removed in migration step 10's cutover, not generated here.

jobs:
  - name: acag-prepare
    log_key: acag
    source: acag
    step: prepare
    time: "0-06:00:00"
    qos: 6hours
    cpus: 4
    mem: 128G
    mem_fraction: 0.6
    temp_dir_prefix: acag

  - name: acag-grid
    log_key: acag
    source: acag
    step: grid
    time: "1-00:00:00"
    qos: 1day
    cpus: 8
    mem: 256G
    mem_fraction: 0.6
    temp_dir_prefix: acag

  - name: berman_mining-grid
    log_key: berman_mining
    source: berman_mining
    step: grid
    partition: bigmem
    time: "00:30:00"
    qos: 30min
    cpus: 8
    mem: 256G
    mem_fraction: 0.6
    temp_dir_prefix: berman_mining

  - name: eog-viirs-grid
