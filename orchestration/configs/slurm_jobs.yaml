# Per-grid SLURM resource defaults for `assemble create/update --slurm`
# (src/cli/assemble/slurm.py). Keyed by the `--grid` label. One DuckDB process
# per grid=/shake= variant -- `cpus` become DuckDB threads and `mem` * `mem_fraction`
# its `memory_limit` (the rest of the node RAM is headroom for spill to --temp-dir).
# A `--shake` preset runs all its variants sequentially inside the one job, so
# budget `time` accordingly. Any of --slurm-time/-mem/-cpus/-qos/-partition
# overrides a field per invocation; a grid with no entry needs all four given ad hoc.
assembly_jobs:
  - grid: "1km"
    time: "1-00:00:00"
    qos: 1day
    cpus: 16
    mem: 360G
    mem_fraction: 0.85
    partition: scicore
  - grid: "5km"
    time: "06:00:00"
    qos: 6hours
    cpus: 12
    mem: 192G
    mem_fraction: 0.85
    partition: scicore
  - grid: "10km"
    time: "03:00:00"
    qos: 6hours
    cpus: 8
    mem: 96G
    mem_fraction: 0.85
    partition: scicore
  - grid: "25km"
    time: "01:00:00"
    qos: 30min
    cpus: 8
    mem: 48G
    mem_fraction: 0.85
    partition: scicore
