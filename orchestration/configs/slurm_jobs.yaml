# Per-source SLURM resource defaults for `data run --slurm` (src/cli/data/slurm.py).
#
# `data run --source X --step Y --slurm` looks up the (source, step) entry
# below for its #SBATCH resources, submitting via `sbatch --wrap="..."`
# (docs/design/09-integrated-pipeline.md §9: `step` is fetch|prepare|grid,
# matching the `data run` CLI). Any of `--slurm-time`/`--slurm-mem`/
# `--slurm-cpus`/`--slurm-qos`/`--slurm-partition` overrides that entry's
# value for a single invocation. `--chain` walks a source's own
# fetch->prepare->grid order plus `REQUIRES` prerequisites
# (src/data/sources/registry.py) to submit a whole dependency chain with
# `sbatch --dependency=afterok:...`, the same DAG logic the old
# `submit_chain.py` used, now folded into `src/cli/data/slurm.py`.
#
# Resource fields (time/qos/partition/cpus/mem/mem_fraction) encode real
# per-source tuning (e.g. glass_modis's 7-day prepare job, berman_mining's
# bigmem/30min job) transcribed from this table's predecessor
# (orchestration/slurm/jobs.yaml) -- preserved exactly, not guessed.
#
# FETCH steps are deliberately not covered here -- no download-family SLURM
# job has ever existed in this repo (fetch/download runs manually or, for
# MODIS, via the hand-maintained orchestration/scripts/modis-fetch.sh on an
# egress-capable host -- see that script and docs/design/08-hpc-transfer.md).

cluster:
  conda_hook: /scicore/home/meiera/schulz0022/miniforge-pypy3/bin/conda
  python_bin: /scicore/home/meiera/schulz0022/miniforge-pypy3/envs/gnt/bin/python
  project_root: /scicore/home/meiera/schulz0022/projects/growth-and-temperature
  scratch_prefix: /scratch/schulz0022

