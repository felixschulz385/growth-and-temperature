# Unified configuration for the GNT data system
#
# docs/design/09-integrated-pipeline.md: `sources:` entries are now consumed
# by the `pipeline` CLI domain (src/data/sources/registry.py), replacing the
# old `download`/`preprocess` split. `misc` is split into `osm`/`gadm`/
# `country_classifications` (§7); each source's config carries an `origins:`
# list where it fetches more than one file.

# Local runtime paths and optional remote transfer settings.
# Machine-specific values belong in orchestration/configs/data.local.yaml.
paths:
  data_root: ""
  local_index_dir: ""

remote:
  ssh_target: ""
  key_file: ""

# Backbone-wide pipeline settings (docs/design/05-migration.md §1's grid
# switch, finally implemented generically rather than MODIS-only ad hoc).
pipeline:
  grid: ease6933  # or "legacy_4326"
  # docs/design/09-integrated-pipeline.md §14's "layout: v2" physical rename:
  # raw/<data_path>, prepared/<data_path>, grid/<grid_id>/<family>.zarr,
  # replacing the legacy <data_path>/{raw,processed/stage_1,processed/stage_2}
  # nesting -- see src/data/sources/layout.py. Every registered source
  # supports it; still opt-in, "legacy" stays the default everywhere.
  layout: v2 # or "legacy"

# Data source configurations
sources:
  # GLASS MODIS LST Daily 1KM
  glass_modis:
    type: "glass_modis"
    base_url: "https://glass.hku.hk/archive/LST/MODIS/Daily/1KM/"
    year_range: [2000, 2020]

    # Download settings
    download:
      batch_size: 1000
      max_concurrent_downloads: 4
      tar_max_files: 100
      tar_max_size_mb: 500

    # GRID-output verification (src/data/sources/verify.py): overrides the
    # Python-side defaults GlassSource passes in -- edit here rather than in
    # code to loosen/tighten a check per deployment. "std" is excluded from
    # the Kelvin range_vars check since it's a spread, not an absolute
    # temperature.
    verification:
      expected_vars: ["mean", "median", "std", "max", "min", "rollmax3", "rollmin3"]
      value_range: [150, 350]
      range_vars: ["mean", "median", "max", "min", "rollmax3", "rollmin3"]

  # MODIS LST (Planetary Computer STAC) -- MYD21A2 primary, MYD11A1 bounded
  # robustness arm. docs/design/07-modis-ingest.md / 07a-modis-band-reference.md
  modis:
    type: "modis"
    product: "21A2"           # "21A2" (primary) or "11A1" (robustness arm)
    platform: "aqua"
    year_range: [2002, 2025]  # illustrative Aqua-era span, see docs/design/07a §"land tile count"
    lat_clip_deg: 60.0
    qc_max_lst_error_k: 2.0    # configurable pending QC bit-layout verification, docs/design/07 §6
    stac_url: "https://planetarycomputer.microsoft.com/api/stac/v1"
    # tiles: []                # optional explicit override, e.g. the robustness arm's bounded subset
    # land_tiles: []           # optional allowlist restricting to land-covering tiles (default:
    #                          # every tile in the lat_clip_deg band, ocean included). Populate via
    #                          # `python scripts/compute_modis_land_tiles.py --land-polygons
    #                          # <osm PREPARE output>/land_polygons_simplified.gpkg` once `osm`'s
    #                          # PREPARE step has run (docs/design/07a-modis-band-reference.md's
    #                          # "confirm against the actual sinusoidal tile grid + a land mask").
    transfer:
      steps: ["fetch"]

    # GRID-output verification -- "lst_night" is already Kelvin (scale/offset
    # applied at FETCH time), so no packed decode is needed on read.
    verification:
      expected_vars: ["lst_night"]
      value_range: [150, 350]

  modis_robustness_11a1:
    type: "modis"
    product: "11A1"
    platform: "aqua"
    # Bounded robustness-arm subset (docs/design/07-modis-ingest.md §1) -- a
    # handful of tiles spanning biomes/climates x 3-5 years spanning
    # early/mid/late mission, not a full parallel backfill. Tiles chosen by
    # forward-projecting one representative lon/lat per biome through the
    # sinusoidal grid's own formulas (src/data/sources/modis/tiles.py), not
    # guessed from memory, so each id is reproducible/checkable:
    #   h12v09 -- Amazon rainforest      (lat -3,  lon -60,  tropical)
    #   h18v06 -- Sahara desert          (lat 23,  lon  10,  hot arid)
    #   h18v04 -- Central Europe         (lat 48,  lon   8,  temperate)
    #   h22v03 -- Siberian boreal/taiga  (lat 58,  lon  90,  near the 60-deg clip edge)
    #   h30v11 -- Australian outback     (lat -25, lon 135,  arid, southern hemisphere)
    # `years` (not `year_range`, which can only express one contiguous span)
    # picks one early/mid/late-mission year each: 2004 (soon after Aqua's
    # 2002-05-04 launch, past initial commissioning), 2014 (mission
    # midpoint), 2023 (latest complete year as of writing).
    tiles: ["h12v09", "h18v06", "h18v04", "h22v03", "h30v11"]
    years: [2004, 2014, 2023]
    lat_clip_deg: 60.0
    qc_max_lst_error_k: 2.0
    stac_url: "https://planetarycomputer.microsoft.com/api/stac/v1"

    verification:
      expected_vars: ["lst_night"]
      value_range: [150, 350]

  # GLASS AVHRR LST Daily 0.05D
  glass_avhrr:
    type: "glass_avhrr"
    base_url: "https://glass.hku.hk/archive/LST/AVHRR/0.05D/"
    year_range: [1982, 2021]

    # Download settings
    download:
      batch_size: 1000
      max_concurrent_downloads: 4
      tar_max_files: 100
      tar_max_size_mb: 500

    verification:
      expected_vars: ["mean", "median", "std", "max", "min", "rollmax3", "rollmin3"]
      value_range: [150, 350]
      range_vars: ["mean", "median", "max", "min", "rollmax3", "rollmin3"]

  # EOG DMSP Nightlights
  eog_dmsp:
    type: "eog_dmsp"
    base_url: "https://eogdata.mines.edu/wwwdata/dmsp/v4composites_rearrange/"
    data_path: "eog/dmsp"
    year_range: [1992, 2013]  # DMSP data availability period

    # DMSP is a classic 6-bit DN (0-63).
    verification:
      expected_vars: ["dmsp"]
      value_range: [0, 63]

  # EOG VIIRS
  eog_viirs:
    type: "eog_viirs"
    base_url: "https://eogdata.mines.edu/nighttime_light/annual/v21/"
    data_path: "eog/viirs"
    year_range: [2012, 2021]  # VIIRS data availability period

    # VIIRS radiance is continuous and can spike much higher over cities/flares.
    verification:
      expected_vars: ["viirs_annual"]
      value_range: [0, 1000]

  # EOG DVNL
  eog_dvnl:
    type: "eog_dvnl"
    base_url: "https://eogdata.mines.edu/wwwdata/viirs_products/dvnl/"
    data_path: "eog/dvnl"
    year_range: [2013, 2019]  # DVNL data availability period

    verification:
      expected_vars: ["viirs_dvnl"]
      value_range: [0, 1000]

  # Harmonized Nighttime Lights (DMSP-VIIRS)
  ntl_harm:
    type: "ntl_harm"
    base_url: "https://api.figshare.com/v2/articles/9828827"
    data_path: "ntl_harm/harmonized"
    year_range: [1992, 2018]  # Harmonized data availability period
    file_extensions: [".tif", ".zip", ".tar.gz", ".gz"]

    # Download settings
    download:
      batch_size: 50
      max_concurrent_downloads: 1
      tar_max_files: 40
      tar_max_size_mb: 2000
      timeout: 600  # 10 minutes for large files

    verification:
      expected_vars: ["ntl_harm"]
      value_range: [0, 2000]

  # ACAG PM2.5 (Washington University in St. Louis, Box shared folder)
  acag:
    type: "acag"
    data_path: "acag/pm25"
    year_range: [1998, 2023]

    verification:
      expected_vars: ["pm25"]
      value_range: [0, 500]

  # ESA CCI Land Cover (Copernicus CDS API)
  esacci:
    type: "esacci"
    data_path: "esacci/landcover"
    year_range: [1992, 2022]

    verification:
      expected_vars: ["lccs_class"]
      value_range: [0, 220]

  # OpenStreetMap land polygons -- one of the three sources split out of the
  # old `misc` source (docs/design/09-integrated-pipeline.md §7).
  osm:
    type: "osm"
    data_path: "misc"
    namespace: "osm"
    url: "https://osmdata.openstreetmap.de/download/land-polygons-complete-4326.zip"
    name: "land-polygons-complete-4326.zip"
    description: "OpenStreetMap land polygons (WGS84)"

    download:
      batch_size: 2
      max_concurrent_downloads: 1
      tar_max_files: 2
      tar_max_size_mb: 100
      timeout: 600

    verification:
      expected_vars: ["land_mask"]
      value_range: [0, 1]

  # GADM v4.1 administrative boundaries -- second of the three misc-split sources.
  gadm:
    type: "gadm"
    data_path: "misc"
    namespace: "gadm"
    url: "https://geodata.ucdavis.edu/gadm/gadm4.1/gadm_410-levels.zip"
    name: "gadm_410-levels.zip"
    description: "GADM administrative boundaries v4.1"

    download:
      batch_size: 2
      max_concurrent_downloads: 1
      tar_max_files: 2
      tar_max_size_mb: 100
      timeout: 600

    # No verification block by default: expected_vars (GID_0, GID_1, ...) is
    # discovered dynamically from whichever ADM level files PREPARE produced,
    # and there's no fixed upper bound for value_range (0 = "no unit at this
    # level", else a sequential id sized by how many polygons that level
    # has). Uncomment to pin/narrow it explicitly:
    # verification:
    #   expected_vars: ["GID_0", "GID_1", "GID_2"]

  # RESOLVE Ecoregions & Biomes (Dinerstein et al. 2017). REQUIRES gadm's
  # PREPARE+GRID (see src/data/sources/ecoregions/source.py). `url` is
  # RESOLVE's own ArcGIS REST Feature Service query -- not the Esri Hub
  # "Export Data" link, which 302-redirects to an Azure SAS URL that expires
  # about an hour after being minted (unusable as a standing config value).
  # FETCH paginates this query itself (`page_size`, `resultOffset`) rather
  # than downloading one file -- see the module docstring for why (an
  # unpaginated response silently truncates past an apparent ~16MiB upstream
  # cap, and the service rate-limits "large geometry" queries).
  ecoregions:
    type: "ecoregions"
    data_path: "misc"
    namespace: "ecoregions"
    url: "https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/Resolve_Ecoregions/FeatureServer/0/query?where=1=1&outFields=REALM,BIOME_NUM,BIOME_NAME,ECO_ID,ECO_NAME&geometryPrecision=5&f=geojson"
    name: "resolve_ecoregions_2017.gpkg"
    description: "RESOLVE Ecoregions & Biomes (Dinerstein et al. 2017)"
    # page_size: 25  # uncomment to override; download() halves it on any page failure regardless

    download:
      batch_size: 2
      max_concurrent_downloads: 1
      tar_max_files: 2
      tar_max_size_mb: 100
      timeout: 600

    # No verification block by default: realm_id/biome_id/eco_id have no
    # fixed upper bound (0 = "no polygon at this pixel", else a sequential
    # id). Uncomment to pin/narrow it explicitly:
    # verification:
    #   expected_vars: ["realm_id", "biome_id", "eco_id"]

  # UNDP HDI + World Bank income-group classifications, joined on iso3 --
  # third of the three misc-split sources; kept together deliberately, not a
  # 4-way split (docs/design/09-integrated-pipeline.md §7).
  country_classifications:
    type: "country_classifications"
    data_path: "misc"
    namespace: "country_classifications"
    hdi_url: "https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv"
    hdi_name: "HDR25.csv"
    worldbank_url: "https://ddh-openapi.worldbank.org/resources/DR0095334/download"
    worldbank_name: "DR0095334.xlsx"
    # subfolder fixed to "worldbank" -- the old `misc` config downloaded the
    # World Bank file into the "hdi" subfolder (docs/design/09-integrated-pipeline.md §1).

    download:
      batch_size: 2
      max_concurrent_downloads: 1
      tar_max_files: 2
      tar_max_size_mb: 100
      timeout: 600

    # value_cols vary by which of hdi/worldbank were available at PREPARE
    # time, so only the always-present join key is checked by default.
    verification:
      expected_vars: ["GID_0"]

  # PLAD Harvard Dataverse
  plad:
    type: "plad"
    doi: "doi:10.7910/DVN/YUS575"
    data_path: "plad"
    file_extensions: ["tab"]
    admin_level: 2  # moved from the --admin-level CLI flag (docs/design/09-integrated-pipeline.md §5)
    year_range: [1980, 2022]

    download:
      batch_size: 1
      max_concurrent_downloads: 1
      timeout: 600  # 10 minutes for large files

    # expected_vars' GID_N column must match admin_level above (2 -> GID_2).
    verification:
      expected_vars: ["GID_2", "year", "reg_fav"]

  # Berman Mining Conflict Data (Manual Download Required) -- disabled, not
  # run by the pipeline. Left commented rather than deleted so it can be
  # re-enabled by uncommenting.
  # berman_mining:
  #   type: "berman_mining"
  #   data_path: "berman_mining"
  #
  #   download:
  #     batch_size: 1
  #     max_concurrent_downloads: 1
  #     tar_max_files: 5
  #     tar_max_size_mb: 500
  #     timeout: 60

  # World Bank Pink Sheet commodity prices -- FETCH + PREPARE only (no GRID,
  # a tiny (commodity, year) lookup table). Consumed by snl_mining's PREPARE
  # step (REQUIRES) to build the mine_priceshock_* variables.
  commodity_prices:
    type: "commodity_prices"
    data_path: "commodity_prices"
    prices_url: "https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Annual.xlsx"
    prices_name: "CMO-Historical-Data-Annual.xlsx"
    # This WB Pink Sheet URL embeds a content hash + release date and rotates
    # roughly monthly -- if FETCH starts 404ing, get the current link from
    # https://www.worldbank.org/en/research/commodity-markets and update
    # prices_url above; this is expected maintenance, not a bug.
    prices_path: "raw/commodity_prices/auxiliary/CMO-Historical-Data-Annual.xlsx"
    # ^ points PREPARE at the already-staged manual copy instead of requiring
    #   a fresh FETCH; remove this key to require FETCH's own output instead.
    #   Path is relative to data_root and must include the "raw/" prefix
    #   that pipeline.layout: v2 (above) puts every source's raw files under.

    download:
      batch_size: 1
      max_concurrent_downloads: 1
      timeout: 120

  # SNL/S&P Global Mining Property Tables -> GRID
  snl_mining:
    type: "snl_mining"
    data_path: "snl_mining"  # fixed: was "snf_mining", inconsistent with the debug config (docs/design/09-integrated-pipeline.md §5)
    # duckdb_path left unset: like every other source, snl_mining computes it
    # from output_root(FETCH), which follows ctx.layout (pipeline.layout
    # above, currently "v2") -- <data_root>/raw/snl_mining/manual_xls/
    # snl_mining_manual_export.duckdb.
    properties_table: "properties"
    llm_years_table: "property_llm_years"
    work_history_table: "property_work_history_events"
    latitude_column: "latitude"
    longitude_column: "longitude"
    opening_year_column: "actual_start_up_year"
    closing_year_column: "actual_closure_year"
    llm_opening_year_column: "llm_opening_year"
    llm_closing_year_column: "llm_closing_year"
    # User-owned table inside the stage-0 DuckDB: per-mine commodity
    # production shares (property_id, commodity, share), static across a
    # mine's active years, commodity already normalized via
    # src.data.sources.commodities.normalize_commodity(..., source="snl").
    # Joined against commodity_prices' PREPARE output (REQUIRES) to build
    # mine_priceshock_*.
    commodity_shares_table: "commodity_shares"
    aggregation:
      # prepared_db_path / admin_variables[*].geometry_path: no longer pinned
      # here -- both used to hardcode the legacy processed/stage_1 shape,
      # which silently ignored `pipeline.layout: v2` above. Left unset, the
      # source computes them via layout.output_root(..., layout=ctx.layout)
      # (src/data/sources/snl_mining/source.py), matching every other source.
      output_filename: "snl_mining_timeseries_reprojected.zarr"
      metric_crs: "ESRI:54009"
      tile_size: 512
      semantics:
        radius: "count of active mine buffers covering pixel center"
        priceshock: "sum of share * ln(real price) over active, price-matched mine buffers covering pixel center; NaN where none"
      radius_variables:
        mine_count_10km:
          radius_km: 10
          table_name: "mine_buffers_10km"
          value_column: "value"
          dtype: "uint16"
        mine_count_20km:
          radius_km: 20
          table_name: "mine_buffers_20km"
          value_column: "value"
          dtype: "uint16"
        mine_count_50km:
          radius_km: 50
          table_name: "mine_buffers_50km"
          value_column: "value"
          dtype: "uint16"
        mine_priceshock_10km:
          radius_km: 10
          table_name: "mine_buffers_10km"
          value_column: "value_priceshock"
          dtype: "float32"
        mine_priceshock_20km:
          radius_km: 20
          table_name: "mine_buffers_20km"
          value_column: "value_priceshock"
          dtype: "float32"
        mine_priceshock_50km:
          radius_km: 50
          table_name: "mine_buffers_50km"
          value_column: "value_priceshock"
          dtype: "float32"
      # Rasterized (zarr) variables: radius-buffer counts + price-shock sums,
      # both genuinely per-pixel. mine_count_adm1/mine_count_adm2 (constant
      # within a GID_1/GID_2 admin polygon) are exported as GID-keyed parquet
      # sidecars instead and merged during assembly, not listed here.
      output_variables:
        - "mine_count_10km"
        - "mine_count_20km"
        - "mine_count_50km"
        - "mine_priceshock_10km"
        - "mine_priceshock_20km"
        - "mine_priceshock_50km"

    # expected_vars must track aggregation.output_variables above. value_range
    # applies only to the uint16 mine_count_* family (range_vars) -- the
    # float32 mine_priceshock_* family is on a different physical scale and
    # only gets the unconditional "sample isn't entirely NaN" check.
    verification:
      expected_vars: ["mine_count_10km", "mine_count_20km", "mine_count_50km", "mine_priceshock_10km", "mine_priceshock_20km", "mine_priceshock_50km"]
      value_range: [0, 200]
      range_vars: ["mine_count_10km", "mine_count_20km", "mine_count_50km"]

# Data assembly configurations
assemble:
  modis:
    description: "MODIS assembly with all datasets"
    output_path: "${DATA_NOBACKUP}/assembled/modis.parquet"
    datasets:
      modis:
        path: "${DATA_NOBACKUP}/glass/LST/MODIS/Daily/1KM/processed/stage_3/modis_tabular.parquet"
        index_cols: ["pixel_id", "time"]
        columns: ["pixel_id", "time", "median"]
      viirs:
        path: "${DATA_NOBACKUP}/eog/viirs/processed/stage_3/viirs_annual_tabular.parquet"
        index_cols: ["pixel_id", "time"]
        join_type: "left"
      dvnl:
        path: "${DATA_NOBACKUP}/eog/dvnl/processed/stage_3/viirs_dvnl_tabular.parquet"
        index_cols: ["pixel_id", "time"]
        join_type: "left"
      dmsp:
        path: "${DATA_NOBACKUP}/eog/dmsp/processed/stage_3/dmsp_tabular.parquet"
        index_cols: ["pixel_id", "time"]
        join_type: "left"
      cluster_vars:
        path: "${DATA_NOBACKUP}/misc/processed/stage_3/gadm_countries_grid_tabular.parquet"
        index_cols: ["pixel_id"]
        join_type: "left"
      land_mask:
        path: "${DATA_NOBACKUP}/misc/processed/stage_3/osm_land_mask_tabular.parquet"
        index_cols: ["pixel_id"]
        join_type: "left"
    processing:
      compression: "zstd"
      # demean_columns/filter_land_only/spark deleted -- confirmed dead
      # config, not read anywhere in src/data/assemble/*.py
      # (docs/design/05-migration.md §2).

  temperature_only:
    description: "Temperature data only assembly"
    output_path: "${DATA_NOBACKUP}/assembled/temperature_only.parquet"
    datasets:
      modis:
        path: "${DATA_NOBACKUP}/glass/LST/MODIS/Daily/1KM/processed/stage_3/modis_tabular.parquet"
        index_cols: ["pixel_id", "time"]
        columns: ["pixel_id", "time", "median"]
      land_mask:
        path: "${DATA_NOBACKUP}/misc/processed/stage_3/osm_land_mask_tabular.parquet"
        index_cols: ["pixel_id"]
        join_type: "left"
    processing:
      compression: "zstd"
