# Unified configuration for the GNT data system
#
# docs/design/09-integrated-pipeline.md: `sources:` entries are now consumed
# by the `pipeline` CLI domain (src/data/sources/registry.py), replacing the
# old `download`/`preprocess` split. `misc` is split into `osm`/`gadm`/
# `country_classifications` (§7); each source's config carries an `origins:`
# list where it fetches more than one file.

# Local runtime paths and optional remote transfer settings.
# Machine-specific values belong in orchestration/configs/data.local.yaml.
paths:
  data_root: ""
  local_index_dir: ""

remote:
  ssh_target: ""
  key_file: ""

# Backbone-wide pipeline settings (docs/design/05-migration.md §1's grid
# switch, finally implemented generically rather than MODIS-only ad hoc).
pipeline:
  grid: ease6933  # or "legacy_4326"
  # docs/design/09-integrated-pipeline.md §14's physical layout: raw/<data_path>,
  # prepared/<data_path>/<agg>/..., grid stores under
  # prepared/<data_path>/crs/<grid_id>/<family>.zarr -- see
  # src/data/sources/layout.py. The only layout every source now builds; no
  # config switch left here (the old opt-in "legacy" layout was removed).

# Data source configurations
sources:
  # GLASS MODIS LST Daily 1KM -- docs/design/11-glass-static-fetch.md: FETCH
  # attempts every (year, day, land tile) target directly, no crawl.
  glass_modis:
    type: "glass_modis"
    base_url: "https://glass.hku.hk/archive/LST/MODIS/Daily/1KM/"
    # Real data span: day 055 of 2000 through day 365 of 2020 (not calendar-
    # year-aligned -- neither bound is Jan 1/Dec 31), confirmed against the
    # real site. Not the same thing as a `year_range` (that implies a full
    # first/last year).
    day_range:
      start: [2000, 55]
      end: [2020, 365]
    # Fill/QC-free validity range (docs/design/12-glass-modis-rebuild.md §1):
    # a pixel counts as valid iff not-fill (per the HDF's own _FillValue/
    # scale_factor, auto-applied by rxr.open_rasterio(masked=True)) AND
    # within this physically-plausible Kelvin range -- mirrors `modis:`'s
    # own lst_min_k/lst_max_k.
    value_min: 150.0
    value_max: 350.0
    # count_above/count_below thresholds (§2): GLASS LST is a daytime/
    # blended product (unlike ModisSource's night-only LST_Night_1KM), so
    # night defaults don't apply -- daytime placeholders, not verified
    # figures yet (35C / 0C).
    heat_stress_k: 308.15
    cold_stress_k: 273.15
    # Same 282-tile land allowlist as the `modis:` block above (identical
    # sinusoidal grid, `scripts/compute_modis_land_tiles.py`'s output) --
    # keep the two lists in sync if either is ever regenerated.
    land_tiles: &glass_modis_land_tiles [
