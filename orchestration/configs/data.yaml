    # GRID-output verification (src/data/sources/verify.py): overrides the
    # Python-side defaults GlassModisSource passes in -- edit here rather
    # than in code to loosen/tighten a check per deployment. 8-band shape
    # per docs/design/12-glass-modis-rebuild.md §2/§5 (dropped median/
    # rollmax3/rollmin3 -- no longer computed). "std"/the two count vars are
    # excluded from the Kelvin range_vars check: std is a spread, not an
    # absolute temperature, and the counts are day-counts, not Kelvin.
    verification:
      expected_vars: ["mean", "std", "max", "min", "count_above", "count_below", "valid_period_count", "valid_month_count"]
      value_range: [150, 350]
      range_vars: ["mean", "max", "min"]

  # GLASS Land Air Temperature (MODIS) -- docs/design/12-glass-modis-rebuild.md
  # §0/§3: shares glass_modis's rebuilt (tile, year) FETCH/PREPARE pipeline
  # as a second variant (GlassModisSource, variant="ta"), same day_range and
  # land tile grid, three daily bands (Ta_min/Ta_mean/Ta_max) instead of one.
  #
  # Ta's physical unit is confirmed Kelvin (checked against a real
  # downloaded GLASS18A01 granule via pyhdf, 2026-08-17: units='K',
  # scale_factor=0.01, valid_range=[16000, 37000] raw -> 160-370 K
  # physical). value_min/value_max below reflect that confirmed range.
  # heat_stress_k/cold_stress_k (35C/0C) remain illustrative tuning
  # defaults, not verified figures -- the unit was the open question, not
  # these thresholds.
  glass_ta_modis:
    type: "glass_ta_modis"
    base_url: "https://glass.hku.hk/archive/Ta/MODIS/"
    day_range:
      start: [2000, 55]
      end: [2020, 365]
    value_min: 160.0
    value_max: 370.0
    heat_stress_k: 308.15
    cold_stress_k: 273.15
    # Same sinusoidal grid as glass_modis/modis -- reuse the precomputed list.
    land_tiles: *glass_modis_land_tiles

    verification:
      expected_vars: ["mean", "std", "max", "min", "count_above", "count_below", "valid_period_count", "valid_month_count"]
      value_range: [160, 370]
      range_vars: ["mean", "max", "min"]

